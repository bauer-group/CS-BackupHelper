# =============================================================================
# BackupHelper — End-to-End Test Matrix (infra only; driven by scripts/e2e.sh)
# =============================================================================
# Stands up every backup source backend + a MinIO destination so scripts/e2e.sh
# can run a real backup→restore roundtrip against each engine, and the
# receivers its other suites deliver to. Each suite starts only its services:
#
#   postgres / mariadb / mysql — DB dump + restore (postgres incl. a partitioned
#                                table and a restricted role's grants)
#   minio (+ assets bucket)    — S3-bucket-source mirror + restore
#   local files                — filesystem source + restore (writable /files)
#   sink, mail-starttls,       — alerts suite: HTTP and SMTP receivers
#   mail-smtps
#   minio-tls                  — tls suite: MinIO over HTTPS only
#
# TLS services and the backup service mount .e2e-pki/ (read-only, /pki): a CA
# and server certificate scripts/e2e.sh generates per run, never committed.
#
# The `backup` service carries no fixed config; the script passes a per-engine
# BACKUP_CONFIG_JSON via `docker compose run -e`. The database images below are
# the ones Dependabot keeps current; scripts/e2e.sh can swap them per run
# (E2E_POSTGRES_IMAGE / E2E_MARIADB_IMAGE / E2E_MYSQL_IMAGE).
# =============================================================================

x-logging: &logging
  logging: { driver: json-file, options: { max-size: "10m", max-file: "1" } }

services:

  postgres:
    image: postgres:18-alpine
    container_name: bh-e2e_POSTGRES
    hostname: postgres
    <<: *logging
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: devpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [e2e]

  mariadb:
    image: mariadb:13
    container_name: bh-e2e_MARIADB
    hostname: mariadb
    <<: *logging
    environment:
      MARIADB_DATABASE: app
      MARIADB_USER: app
      MARIADB_PASSWORD: devpassword
      MARIADB_ROOT_PASSWORD: rootpw
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks: [e2e]

  mysql:
    image: mysql:26.7
    container_name: bh-e2e_MYSQL
    hostname: mysql
    <<: *logging
    # Default authentication: caching_sha2_password (the default since MySQL
    # 8.0; mysql_native_password is off in 8.4 and gone in 9.0). The engine
    # image ships its client plugin (mariadb-connector-c), see docs/sources.md.
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: devpassword
      MYSQL_ROOT_PASSWORD: rootpw
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpw"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [e2e]

  minio:
    image: ghcr.io/bauer-group/cs-minio/minio:latest
    container_name: bh-e2e_MINIO
    hostname: minio
    <<: *logging
    command: server --address ":9000" --console-address ":9090" /data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: minioadmin-dev
      MINIO_REGION_NAME: eu-central-1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 15s
    networks: [e2e]

  minio-init:
    image: ghcr.io/bauer-group/cs-minio/minio-init:latest
    container_name: bh-e2e_MINIO_INIT
    restart: "no"
    <<: *logging
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: minioadmin-dev
      CONSOLE_USER: console-admin
      CONSOLE_PASSWORD: console-dev-pass
    configs:
      - source: minio-init-config
        target: /app/config/init.json
    depends_on:
      minio: { condition: service_healthy }
    networks: [e2e]

  # ── alerts suite ──────────────────────────────────────────────────────────
  # sink: records every HTTP alert (webhook, Teams, Slack, Discord, ntfy,
  # Healthchecks) for scripts/e2e_alerts.py - the engine image's own python.
  sink:
    image: backuphelper:e2e
    pull_policy: never
    container_name: bh-e2e_SINK
    hostname: sink
    <<: *logging
    entrypoint: ["python", "/e2e/e2e_alerts.py", "serve"]
    volumes:
      - ./scripts/e2e_alerts.py:/e2e/e2e_alerts.py:ro
    healthcheck:
      test: ["CMD", "python", "/e2e/e2e_alerts.py", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [e2e]

  # Two SMTP servers (Mailpit) with a certificate of the runtime CA that
  # scripts/e2e.sh generates into .e2e-pki/: STARTTLS required on 587, implicit
  # TLS (SMTPS) on 465, login required on both (E2E_SMTP_AUTH, "user:password",
  # built at runtime). Their API on 8025 serves the messages that arrived.
  mail-starttls:
    image: axllent/mailpit:v1
    container_name: bh-e2e_MAIL_STARTTLS
    hostname: mail-starttls
    <<: *logging
    environment:
      MP_SMTP_BIND_ADDR: 0.0.0.0:587
      MP_SMTP_TLS_CERT: /pki/server.crt
      MP_SMTP_TLS_KEY: /pki/server.key
      MP_SMTP_REQUIRE_STARTTLS: "true"
      MP_SMTP_AUTH: ${E2E_SMTP_AUTH:-}
    volumes:
      - ./.e2e-pki:/pki:ro
    networks: [e2e]

  mail-smtps:
    image: axllent/mailpit:v1
    container_name: bh-e2e_MAIL_SMTPS
    hostname: mail-smtps
    <<: *logging
    environment:
      MP_SMTP_BIND_ADDR: 0.0.0.0:465
      MP_SMTP_TLS_CERT: /pki/server.crt
      MP_SMTP_TLS_KEY: /pki/server.key
      MP_SMTP_REQUIRE_TLS: "true"
      MP_SMTP_AUTH: ${E2E_SMTP_AUTH:-}
    volumes:
      - ./.e2e-pki:/pki:ro
    networks: [e2e]

  # ── tls suite ─────────────────────────────────────────────────────────────
  # MinIO over HTTPS only, with the runtime CA's server certificate
  # (.e2e-pki/minio: public.crt, private.key and an empty CAs/ - the mount is
  # read-only, so MinIO must not have to create it). Its root password,
  # E2E_MINIO_TLS_SECRET, is built at runtime by scripts/e2e/tls.sh.
  minio-tls:
    image: ghcr.io/bauer-group/cs-minio/minio:latest
    container_name: bh-e2e_MINIO_TLS
    hostname: minio-tls
    <<: *logging
    command: server --address ":9000" --certs-dir /pki/minio /data
    environment:
      MINIO_ROOT_USER: tls-admin
      MINIO_ROOT_PASSWORD: ${E2E_MINIO_TLS_SECRET:-}
      MINIO_REGION_NAME: eu-central-1
    volumes:
      - ./.e2e-pki:/pki:ro
    healthcheck:
      test: ["CMD", "curl", "-fsk", "https://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    networks: [e2e]

  backup:
    build: { context: . }
    image: backuphelper:e2e
    <<: *logging
    environment:
      BACKUP_DATA_DIR: /data
      BACKUP_LOG_LEVEL: INFO
    volumes:
      - e2e-data:/data
      - e2e-files:/files
      - ./.e2e-pki:/pki:ro
    networks: [e2e]

configs:
  minio-init-config:
    content: |
      {
        "$$schema": "https://raw.githubusercontent.com/bauer-group/CS-MinIO/main/init.schema.json",
        "_description": "BackupHelper E2E — backups (dest) + assets (s3-source) buckets + scoped user.",
        "buckets": [
          {"name": "backups", "region": "eu-central-1", "versioning": false, "policy": "private"},
          {"name": "assets",  "region": "eu-central-1", "versioning": false, "policy": "private"}
        ],
        "policies": [
          {"name": "pBackup", "statements": [
            {"Effect": "Allow",
             "Action": ["s3:GetObject","s3:PutObject","s3:DeleteObject","s3:GetObjectTagging","s3:PutObjectTagging","s3:AbortMultipartUpload"],
             "Resource": ["arn:aws:s3:::backups/*","arn:aws:s3:::assets/*"]},
            {"Effect": "Allow",
             "Action": ["s3:ListBucket","s3:GetBucketLocation"],
             "Resource": ["arn:aws:s3:::backups","arn:aws:s3:::assets"]}
          ]}
        ],
        "groups": [{"name": "gBackup", "policies": ["pBackup"]}],
        "users": [{"access_key": "backup-app", "secret_key": "backup-secret-dev", "groups": ["gBackup"]}]
      }

networks:
  e2e:
    driver: bridge
    name: bh-e2e

volumes:
  e2e-data:
  e2e-files:
