name: "🔄 Check Base Image Updates"

on:
  schedule:
    # Daily at 00:07 UTC (01:07 CET / 02:07 CEST) - a slot of its own, so the
    # organisation's base image monitors do not release at the same time.
    # Slot table: bauer-group/automation-templates docs/workflows/modules-docker-base-image-monitor.md
    - cron: '7 0 * * *'

  workflow_dispatch:
    inputs:
      dry-run:
        description: 'only check for updates without creating commits or releases'
        type: boolean
        default: false

jobs:
  check-updates:
    name: Check for Base Image Updates
    uses: bauer-group/automation-templates/.github/workflows/modules-docker-base-image-monitor.yml@main
    with:
      config-file: '.github/config/docker-base-image-monitor/base-images.json'
      dry-run: ${{ inputs.dry-run || false }}
      target-workflow: 'docker-release.yml'
      target-workflow-inputs: '{"force-release": "true"}'
    secrets: inherit
