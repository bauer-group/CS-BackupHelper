# =============================================================================
# Docker Maintenance — Auto-merge Dependabot PRs (every ecosystem)
# =============================================================================
# Every Dependabot PR reaches this workflow (no paths: filter), so each one
# gets an explicit decision and annotation instead of silently staying open.
# A PR is merged only after the pull_request run of docker-release.yml passed
# on its head commit - pytest, the e2e backup round trips and the image build:
#
#   docker          Dockerfile              the image is built from it
#   pip             pyproject.toml          pytest, image build (pytest gate)
#   docker-compose  docker-compose.e2e.yml  the round trips start its servers
#   github-actions  .github/workflows/**    never merged: a CI change
#
# A PR whose files do not start docker-release.yml stays open as "not
# tested". The merge is made with GITHUB_TOKEN and starts no push workflow.
# =============================================================================

name: 🔧 Docker Maintenance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance:
    name: Auto-merge Dependabot PRs
    uses: bauer-group/automation-templates/.github/workflows/docker-maintenance-dependabot.yml@main
    with:
      merge-method: 'squash'
      auto-approve: true
      # Merge only after this PR CI has passed on the PR head commit - it
      # runs the tests and the backup round trips and builds the image.
      required-workflows: '.github/workflows/docker-release.yml'
    secrets: inherit
