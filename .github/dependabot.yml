# =============================================================================
# Dependabot Configuration
# =============================================================================
# Watches:
#   1. GitHub Actions versions (workflows pinned to @main pull module updates)
#   2. The Python runtime dependencies (pyproject.toml)
#   3. The base image inside ./Dockerfile (python:3.14-alpine)
#   4. Image references inside docker-compose*.yml files
#
# docker-maintenance.yml merges a PR after its CI passed (patch updates by
# default) and dispatches docker-release.yml. The commit prefix decides
# whether that run releases a new image:
#   fix(docker) / fix(deps)  the base image and the runtime dependencies are
#                            in the shipped image -> PATCH release
#   chore(deps-dev)          test-only Python dependencies -> no release
#   chore(deps)              images of the dev stack and the e2e servers,
#                            not shipped -> no release
#   chore(ci)                GitHub Actions -> no release, merged by hand
# Pure digest drift on the existing tag is handled by check-base-images.yml
# (daily cron).
# =============================================================================

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "github-actions"
      - "dependabot"
    commit-message:
      prefix: "chore(ci)"

  # Python runtime + test dependencies: the runtime ones are installed into
  # the image (fix -> release), the [test] extra only runs the tests
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "python"
      - "dependabot"
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps-dev)"

  # Base image (python:3.14-alpine in ./Dockerfile)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "docker"
      - "dependabot"
    commit-message:
      prefix: "fix(docker)"

  # docker-compose images: what Dependabot can update are the dev stack and
  # the e2e servers - not shipped. The example files operators copy
  # (docker-compose.yml, docker-compose.sidecar.yml) name their images through
  # ${...} variables, which Dependabot leaves alone. So: no release.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "docker"
      - "dependabot"
    commit-message:
      prefix: "chore(deps)"
