# =============================================================================
# Dependabot Configuration
# =============================================================================
# Watches:
#   1. GitHub Actions versions (workflows pinned to @main pull module updates)
#   2. The Python runtime dependencies (pyproject.toml)
#   3. The base image inside ./Dockerfile (python:3.14-alpine)
#   4. Image references inside docker-compose*.yml files
#
# Base-image tag bumps here (e.g. python:3.14-alpine → 3.15-alpine) surface as
# PRs and are auto-merged by docker-maintenance.yml. Pure digest drift on the
# existing tag is handled by check-base-images.yml (daily cron).
#
# The commit prefix decides whether a merged update is released: fix(...)
# cuts a PATCH release and rebuilds the image, chore(...) releases nothing.
# Everything that ends up in the shipped image uses fix(...):
#   docker          -> fix(docker): the base image of ./Dockerfile
#   pip             -> fix(deps): the runtime packages pyproject.toml
#                      installs into the image (prefix-development:
#                      chore(deps-dev) for what Dependabot counts as dev)
#   docker-compose  -> chore(deps): only the e2e and development stacks
#                      pin images Dependabot can update (the shipped
#                      sidecar and example use ${VAR:-default} references)
#   github-actions  -> chore(ci): no release, never auto-merged
# =============================================================================

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "13:35"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "github-actions"
      - "dependabot"
    commit-message:
      prefix: "chore(ci)"

  # Python runtime + test dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "13:35"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "python"
      - "dependabot"
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps-dev)"

  # Base image (python:3.14-alpine in ./Dockerfile)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "13:35"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "docker"
      - "dependabot"
    commit-message:
      prefix: "fix(docker)"

  # docker-compose example images
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "13:35"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "docker"
      - "dependabot"
    commit-message:
      prefix: "chore(deps)"
